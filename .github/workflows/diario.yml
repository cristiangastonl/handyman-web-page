# Chequeos de una vez por día. Si alguno falla, GitHub manda el mail de "Run
# failed" (uno por día alcanza: ninguno de estos es "el sitio se cayó", eso lo
# mira salud.yml cada hora).
#
# - uso:       pedidos por día a Supabase. El 21/10/2026 Supabase cortó la org
#              por egress y nadie se enteró hasta que el sitio quedó sin fotos.
#              Ver scripts/check-supabase-uso.mjs.
# - base:      filas por tabla contra el techo de 1000 de PostgREST, que recorta
#              sin error (01/10/2026). Ver scripts/check-db-rows.mjs.
# - prerender: las 4 rutas llegan prerenderizadas, con title y description
#              (SEO). Ver scripts/check-prod-seo.mjs.
name: Chequeos diarios

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC, 08:00/09:00 en Zúrich
  workflow_dispatch:

permissions:
  contents: read
  actions: write # para mantener vivos los cron (ver el último paso)

jobs:
  uso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pedidos por día
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-supabase-uso.mjs

  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Filas por tabla
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/check-db-rows.mjs

  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prerender y SEO del sitio publicado
        run: node scripts/check-prod-seo.mjs

  # GitHub apaga los cron de un repo sin commits en 60 días. Con el sitio en
  # mantenimiento puede pasar meses sin tocarse, y el monitoreo se apagaría
  # justo cuando nadie lo mira. Volver a habilitarlos por la API es lo que hace
  # la acción keepalive-workflow para evitarlo; no está comprobado acá hasta que
  # pasen 60 días sin commits (GitHub avisa por mail antes de apagarlos).
  mantener-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Rehabilitar los workflows programados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in diario.yml salud.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable"
          done
